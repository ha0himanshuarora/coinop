name: Release

# Every push to main builds a signed APK, tags it and publishes it as a GitHub Release.
# The commit message becomes the release notes. The first release is 1.0.0; each push after
# that raises the last number by one. To jump to a new minor or major version, run this
# workflow by hand (Actions > Release > Run workflow) and pick minor or major.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history and tags are needed to find the latest release

      - name: Work out the version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            IFS=. read -r ma mi pa <<< "$latest"
            case "${BUMP:-patch}" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              *) pa=$((pa + 1)) ;;
            esac
            version="$ma.$mi.$pa"
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK; this only accepts its licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets first; an APK without them only shows the setup screen."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key, so later versions may not install over it. See the README."
          fi

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          fi

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersion="$VERSION_NAME"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Coinop-$VERSION_NAME.apk"
          (cd dist && sha256sum "Coinop-$VERSION_NAME.apk" > "Coinop-$VERSION_NAME.apk.sha256")
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "${NOTES:-}" ]; then
            notes_arg=(--notes "$NOTES")
          else
            notes_arg=(--generate-notes)
          fi
          gh release create "v$VERSION_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "Coinop $VERSION_NAME" \
            "${notes_arg[@]}" \
            --latest